<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pacific Grove High School - PGHS Quick Start</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root {
    --red: #b00014;
    --red-dark: #7d000e;
    --gold: #f5c542;
    --bg: #14141a;
    --banner-h: 84px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  html { overflow-y: scroll; scrollbar-gutter: stable; }
  body.playing { overflow: hidden; }
  .banner {
    position: sticky;
    top: 0;
    z-index: 10;
    display: grid;
    grid-template-columns: 1fr auto 1fr;   /* chat | title | players */
    align-items: center;
    gap: 12px;
    padding: 18px 20px;
    background: linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%);
    border-bottom: 4px solid var(--gold);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
  }
  .banner h1 {
    text-align: center;
    font-size: clamp(1.4rem, 4vw, 2.4rem);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4);
  }
  .banner h1 a {
    display: inline-block;
    color: inherit;
    text-decoration: none;
    transform-origin: center;
    transition: transform 0.2s ease, text-shadow 0.2s ease;
  }
  .banner h1 a:hover,
  .banner h1 a:focus-visible {
    transform: scale(1.15);
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
    outline: none;
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border: 1px solid var(--gold);
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.3);
    color: var(--gold);
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    white-space: nowrap;
  }
  button.pill { cursor: pointer; }
  button.pill:hover { background: rgba(0, 0, 0, 0.5); }
  .caret { display: inline-block; transition: transform 0.2s ease; font-size: 0.8em; }
  #chat.open .caret { transform: rotate(180deg); }
  
  .banner-right {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #2ee86b;
    box-shadow: 0 0 8px #2ee86b;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.35; } }


  #chat { justify-self: start; }
  #chat-panel {
    position: absolute;
    left: 20px;
    top: calc(100% + 10px);
    width: 340px;
    max-width: calc(100vw - 24px);
    height: 420px;
    max-height: calc(100vh - var(--banner-h) - 24px);
    display: flex;
    flex-direction: column;
    background: #1d1d26;
    border: 1px solid var(--gold);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.6);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  }
  #chat.open #chat-panel {
    opacity: 1;
    visibility: visible;
    transform: none;
  }
  #chat-head {
    padding: 8px 14px;
    background: rgba(0, 0, 0, 0.3);
    color: var(--gold);
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--gold);
  }
  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    font-size: 0.88rem;
    line-height: 1.35;
    word-wrap: break-word;
  }
  #chat-messages .msg { margin-bottom: 6px; }
  #chat-messages .msg b { color: var(--gold); }
  #chat-form {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    border-top: 1px solid #333;
  }
  #chat-form input {
    background: #101016;
    color: #fff;
    border: 1px solid #444;
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 0.88rem;
  }
  #chat-form .row { display: flex; gap: 6px; }
  #chat-form .row input { flex: 1; min-width: 0; }
  #chat-form button {
    background: var(--gold);
    color: #000;
    border: 0;
    border-radius: 999px;
    padding: 0 16px;
    font-weight: 700;
    cursor: pointer;
  }

  /* ---------- Other links dropdown ---------- */
  #links-toggle { cursor: pointer; }
  #links.open .caret { transform: rotate(180deg); }
  #links-panel {
    position: absolute;
    right: 20px;
    top: calc(100% + 10px);
    width: 230px;
    max-width: calc(100vw - 24px);
    max-height: calc(100vh - var(--banner-h) - 24px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    background: #1d1d26;
    border: 1px solid var(--gold);
    border-radius: 14px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.6);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-10px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
  }
  #links.open #links-panel {
    opacity: 1;
    visibility: visible;
    transform: none;
  }
  #links-panel a {
    padding: 10px 14px;
    color: #fff;
    text-decoration: none;
    font-size: 0.9rem;
    border-bottom: 1px solid #333;
  }
  #links-panel a:last-child { border-bottom: 0; }
  #links-panel a:hover { background: rgba(245, 197, 66, 0.15); color: var(--gold); }

  /* ---------- Grid ---------- */
  .grid {
    width: 100%;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 0;                          /* images flush with each other */
    perspective: 1400px;
  }
  body.playing .grid { display: none; }
  .card {
    position: relative;
    z-index: 1;
    display: block;
    aspect-ratio: 16 / 10;           /* rectangular */
    border-radius: 0;                /* sharp corners */
    overflow: hidden;
    background: #222;
    box-shadow: none;
    transform: translateY(0) translateZ(0) rotateX(0deg);
    transform-style: preserve-3d;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    cursor: pointer;
    text-decoration: none;
  }
  .card:hover, .card:focus-visible {
    z-index: 5;                      /* lift above neighbours */
    transform: translateY(-14px) translateZ(40px) rotateX(6deg) scale(1.04);
    box-shadow:
      0 20px 25px rgba(0, 0, 0, 0.55),
      0 35px 45px rgba(0, 0, 0, 0.45);
    outline: none;
  }
  /* Game name shown on top of the picture */
  .card .label {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 28px 12px 10px;
    background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.8));
    color: #fff;
    font-weight: 700;
    font-size: 1.05rem;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    pointer-events: none;
  }
  .card.no-image .label { display: none; }   /* placeholder already shows the name */
  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ---------- Bottom banner ---------- */
  /* Grows only to fill empty space below the grid; adds no height of its own */
  .footer-banner {
    flex: 1 1 0;
    min-height: 0;
    background: linear-gradient(0deg, var(--red) 0%, var(--red-dark) 100%);
    box-shadow: inset 0 4px 0 var(--gold);   /* gold line along the top */
  }
  body.playing .footer-banner { display: none; }

  /* ---------- Full-screen game view (banner stays on top) ---------- */
  #game {
    display: none;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: var(--banner-h);
    z-index: 5;
    background: #000;
  }
  body.playing #game { display: block; }
  #game iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  @media (max-width: 600px) {
    .banner { grid-template-columns: auto 1fr; padding: 12px; row-gap: 10px; }
    .banner h1 { grid-column: 1 / -1; grid-row: 1; }
    #chat { grid-column: 1; grid-row: 2; }
    .banner-right { grid-column: 2; grid-row: 2; gap: 6px; }
    .banner-right .pill { font-size: 0.8rem; padding: 6px 10px; }
    #links-panel { right: 12px; }
    #chat-panel { left: 12px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="banner">
  <div id="chat">
    <button id="chat-toggle" class="pill" type="button" aria-expanded="false">
      Chat <span class="caret">&#9662;</span>
    </button>
    <div id="chat-panel">
      <div id="chat-head">Live Chat</div>
      <div id="chat-messages"></div>
      <form id="chat-form" autocomplete="off">
        <input id="chat-name" maxlength="16" placeholder="Your name (optional)">
        <div class="row">
          <input id="chat-text" maxlength="200" placeholder="Say something...">
          <button type="submit">Send</button>
        </div>
      </form>
    </div>
  </div>

  <h1><a href="#" id="home-link">PGHS Fun</a></h1>

  <div class="banner-right">
    <div id="links">
      <button id="links-toggle" class="pill" type="button" aria-expanded="false">
        Other links <span class="caret">&#9662;</span>
      </button>
      <div id="links-panel">
        <a href="https://pghsfun.github.io" target="_blank" rel="noopener">pghsfun.github.io</a>
        <a href="https://apcalculus1.github.io" target="_blank" rel="noopener">apcalculus1.github.io</a>
        <a href="https://pacificgrovehighschool.github.io" target="_blank" rel="noopener">pacificgrovehighschool.github.io</a>
        <a href="https://pghseducation.github.io" target="_blank" rel="noopener">pghseducation.github.io</a>
        <a href="https://governmentstudies.github.io" target="_blank" rel="noopener">governmentstudies.github.io</a>
        <a href="https://homeworktutoring.github.io" target="_blank" rel="noopener">homeworktutoring.github.io</a>
      </div>
    </div>
    <div class="players pill"><span class="dot"></span><span>Players online: <span id="count">5</span></span></div>
  </div>
</header>

<main class="grid" id="grid"></main>

<footer class="footer-banner"></footer>

<div id="game"><iframe id="game-frame" title="Game" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe></div>

<script>
  // ----  GAMES: edit this list ----
  //   slug  = the URL name AND the folder name AND the image name
  //           (lowercase letters, numbers, hyphens only - no spaces)
  //   title = the name shown on the tile / tooltip / browser tab
  //
  //   slug "snake" ->  image: images/snake.png  (also tries .jpg, .jpeg, .webp)
  //                    game:  snake/index.html  (or snake/build/index.html etc.)
  //                    URL:   yoursite.com/#/snake
  //
  // Tiles appear in the same order as this list.
  const IMAGE_TYPES = ["png", "jpg", "jpeg", "webp"];
  const games = [
    { slug: "slope",       title: "Slope" },
    { slug: "minecraft",      title: "Minecraft" },
    { slug: "geometrydash", title: "Geometry Dash" },
    { slug: "run3", title: "Run 3" },
    { slug: "plantsvszombies", title: "Plants V.S. Zombies" },
    { slug: "granny", title: "Granny" },
    { slug: "superhot", title: "SUPERHOT" },
    { slug: "polytrack", title: "PolyTrack" },
    { slug: "rooftoprun", title: "Rooftop Run" },
    { slug: "1v1lol", title: "1v1.LOL" },
    { slug: "backrooms", title: "Backrooms" },
    { slug: "highwaytraffic", title: "Highway Traffic" },
    { slug: "angrybirds", title: "Angry Birds" },
    { slug: "clusterrush", title: "Cluster Rush" },
    { slug: "retrobowl", title: "Retro Bowl" },
    { slug: "murder", title: "Murder" },
    { slug: "bloonstd5", title: "Bloons TD 5" },
    { slug: "tunnelrush", title: "Tunnel Rush" },
    { slug: "superliquidsoccer", title: "Super Liquid Soccer" },
    { slug: "3dflightsimulator", title: "3D Flight Simulator" },
    { slug: "ragdollhit", title: "Ragdoll Hit" },
    { slug: "stickmanhook", title: "Stickman Hook" },
    { slug: "3dfreekick", title: "3D Free Kick" },
    { slug: "motox3m", title: "Moto X3M" },
    { slug: "sandboxcity", title: "Sandbox City" },
    { slug: "crazycattle3d", title: "Crazy Cattle 3D" },
    { slug: "carkingarena", title: "Car King Arena" },
    { slug: "basketballstars", title: "Basketball Stars" },
    { slug: "littlealchemy2", title: "Little Alchemy 2" },
  ].map(g => ({ ...g, href: g.slug + "/" }));

  function placeholder(title, i) {
    const hue = (i * 37) % 360;
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300">
         <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
           <stop offset="0" stop-color="hsl(${hue},70%,45%)"/>
           <stop offset="1" stop-color="hsl(${(hue + 50) % 360},70%,25%)"/>
         </linearGradient></defs>
         <rect width="480" height="300" fill="url(#g)"/>
         <text x="50%" y="52%" fill="white" font-family="Arial" font-size="38"
               font-weight="bold" text-anchor="middle">${title}</text>
       </svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  // ---- Build the grid ----
  const grid = document.getElementById("grid");
  function buildGrid() {
    grid.textContent = "";
    games.forEach((g, i) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = g.href;
      a.title = g.title;
      const img = document.createElement("img");
      img.alt = g.title;
      // Try images/gameN.png, then .jpg, .jpeg, .webp, then a colored placeholder
      let t = 0;
      img.onerror = () => {
        t++;
        if (t < IMAGE_TYPES.length) {
          img.src = "images/" + g.slug + "." + IMAGE_TYPES[t];
        } else {
          img.onerror = null;
          a.classList.add("no-image");
          img.src = placeholder(g.title, i);
        }
      };
      img.src = "images/" + g.slug + "." + IMAGE_TYPES[0];
      a.appendChild(img);
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = g.title;
      a.appendChild(label);
      a.addEventListener("click", ev => {
        if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button !== 0) return;
        ev.preventDefault();
        location.hash = "#/" + g.slug;       // open the game inside the site
      });
      grid.appendChild(a);
    });
  }

  // ---- Keep the game view exactly below the banner ----
  const banner = document.querySelector(".banner");
  function setBannerHeight() {
    document.documentElement.style.setProperty("--banner-h", banner.offsetHeight + "px");
  }
  setBannerHeight();
  window.addEventListener("resize", setBannerHeight);
  if (window.ResizeObserver) new ResizeObserver(setBannerHeight).observe(banner);

  // ---- Find where a game's index.html lives ----
  // Checks these locations inside gameN/ in order and uses the first that exists.
  // Works for a plain gameN/index.html, and for games that also have a build
  // folder (e.g. gameN/index.html + gameN/build/..., or gameN/build/index.html).
  const GAME_PATHS = ["index.html", "build/index.html", "Build/index.html", "dist/index.html"];
  const resolvedUrls = {};
  async function findGameUrl(g) {
    if (resolvedUrls[g.slug]) return resolvedUrls[g.slug];
    for (const p of GAME_PATHS) {
      const url = g.slug + "/" + p;
      try {
        const r = await fetch(url, { method: "HEAD" });
        if (r.ok) return (resolvedUrls[g.slug] = url);
      } catch (err) { break; }   // e.g. opened as a local file: just use the default
    }
    return (resolvedUrls[g.slug] = g.href);
  }

  // ---- Open a game full screen and go back home ----
  const frame = document.getElementById("game-frame");
  let savedScroll = 0;

  function route() {
    const m = location.hash.match(/^#\/([a-z0-9_-]+)$/i);
    const slug = m ? m[1].toLowerCase() : null;
    const game = slug ? games.find(g => g.slug === slug) : null;

    if (game) {
      if (!document.body.classList.contains("playing")) savedScroll = window.scrollY;
      if (frame.dataset.slug !== game.slug) {
        frame.dataset.slug = game.slug;
        findGameUrl(game).then(url => {
          if (frame.dataset.slug === game.slug) frame.src = url;
        });
      }
      frame.title = game.title;
      document.body.classList.add("playing");
      document.title = "Pacific Grove High School - PGHS Quick Start"
    } else {
      if (document.body.classList.contains("playing")) {
        document.body.classList.remove("playing");
        frame.src = "about:blank";
        frame.dataset.slug = "";
        window.scrollTo(0, savedScroll);
      }
      document.title = "Pacific Grove High School - PGHS Quick Start";
    }
  }
  window.addEventListener("hashchange", route);

  // Draw the grid, then open any game named in the URL
  buildGrid();
  route();

  // Clicking the title goes home
  document.getElementById("home-link").addEventListener("click", ev => {
    ev.preventDefault();
    if (document.body.classList.contains("playing")) {
      location.hash = "";
    } else {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  });

  // ---- Chat dropdown open / close ----
  const chat = document.getElementById("chat");
  const chatToggle = document.getElementById("chat-toggle");
  function setChat(open) {
    chat.classList.toggle("open", open);
    chatToggle.setAttribute("aria-expanded", open ? "true" : "false");
  }
  chatToggle.addEventListener("click", () => setChat(!chat.classList.contains("open")));
  document.addEventListener("click", ev => { if (!chat.contains(ev.target)) setChat(false); });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") setChat(false); });
  // Clicking into the game window moves focus to the frame; close the chat then
  window.addEventListener("blur", () => { if (document.activeElement === frame) setChat(false); });

  // ---- Other links dropdown open / close ----
  const linksBox = document.getElementById("links");
  const linksToggle = document.getElementById("links-toggle");
  function setLinks(open) {
    linksBox.classList.toggle("open", open);
    linksToggle.setAttribute("aria-expanded", open ? "true" : "false");
  }
  linksToggle.addEventListener("click", () => setLinks(!linksBox.classList.contains("open")));
  document.addEventListener("click", ev => { if (!linksBox.contains(ev.target)) setLinks(false); });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") setLinks(false); });
  window.addEventListener("blur", () => { if (document.activeElement === frame) setLinks(false); });
</script>

<!-- ---- Real players-online counter + live chat (Firebase Realtime Database) ---- -->
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  // Your Firebase settings live in firebase-config.js so you only paste them once
  const firebaseConfig = window.FIREBASE_CONFIG;

  const MIN_PLAYERS = 5;   // never show fewer than this
  const countEl = document.getElementById("count");
  countEl.textContent = MIN_PLAYERS;

  try {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const me = db.ref("presence").push();

    db.ref(".info/connected").on("value", snap => {
      if (snap.val() === true) {
        me.onDisconnect().remove();   // removes this visitor when the tab closes
        me.set(true);                 // adds this visitor
      }
    });

    db.ref("presence").on("value", snap => {
      countEl.textContent = (MIN_PLAYERS + snap.numChildren()).toLocaleString();
    });

    // ---------- Live chat ----------
    const chatBox  = document.getElementById("chat-messages");
    const chatForm = document.getElementById("chat-form");
    const chatText = document.getElementById("chat-text");
    const chatName = document.getElementById("chat-name");
    try { chatName.value = localStorage.getItem("pghs_name") || ""; } catch (err) {}

    // Simple word filter. Add more words to this list as needed.
    const BLOCKED = ["fuck", "shit", "bitch", "asshole", "cunt", "slut", "whore", "nigg", "fag"];
    function clean(s) {
      return BLOCKED.reduce(
        (t, w) => t.replace(new RegExp(w, "gi"), "*".repeat(w.length)), s);
    }

    let lastSent = 0;
    chatForm.addEventListener("submit", ev => {
      ev.preventDefault();
      const text = chatText.value.trim().slice(0, 200);
      const name = (chatName.value.trim() || "Guest").slice(0, 16);
      if (!text) return;
      if (Date.now() - lastSent < 2000) return;   // 1 message per 2 seconds
      lastSent = Date.now();
      try { localStorage.setItem("pghs_name", name); } catch (err) {}
      db.ref("chat").push({
        name: clean(name),
        text: clean(text),
        ts: firebase.database.ServerValue.TIMESTAMP
      });
      chatText.value = "";
    });

    // Messages last 24 hours: only show the last 24h, and delete older ones
    const DAY = 24 * 60 * 60 * 1000;
    function purgeOld() {
      db.ref("chat").orderByChild("ts").endAt(Date.now() - DAY).limitToFirst(100).once("value")
        .then(snap => snap.forEach(child => { child.ref.remove().catch(() => {}); }))
        .catch(() => {});
    }
    purgeOld();
    setInterval(purgeOld, 10 * 60 * 1000);

    db.ref("chat").orderByChild("ts").startAt(Date.now() - DAY).limitToLast(50).on("child_added", snap => {
      const m = snap.val();
      const row = document.createElement("div");
      row.className = "msg";
      const who = document.createElement("b");
      who.textContent = m.name + ": ";
      row.appendChild(who);
      row.appendChild(document.createTextNode(m.text));
      chatBox.appendChild(row);
      while (chatBox.children.length > 50) chatBox.removeChild(chatBox.firstChild);
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  } catch (e) {
    console.warn("Firebase not set up yet; showing default count.", e);
  }
</script>
</body>
</html>
