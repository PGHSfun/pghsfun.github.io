<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Block Blast</title>
<style>
:root{
  --bg:#e9ecf8;--board:#c9cfec;--cell:#dde1f4;--text:#1f2250;--muted:#5d6196;--panel:#ffffffcc;
  --c1:#ff5d73;--c2:#ff9f45;--c3:#ffd23f;--c4:#3ddc97;--c5:#35b6ff;--c6:#7c6bff;--c7:#d56bff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#12142b;--board:#23275a;--cell:#2e3373;--text:#f1f2ff;--muted:#9aa0d8;--panel:#ffffff12}
}
:root[data-theme="dark"]{--bg:#12142b;--board:#23275a;--cell:#2e3373;--text:#f1f2ff;--muted:#9aa0d8;--panel:#ffffff12}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:ui-rounded,"Nunito","Trebuchet MS",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:none;overflow:hidden}
#top{display:flex;justify-content:space-between;align-items:flex-end;width:var(--B,360px);height:46px}
.stat{display:flex;flex-direction:column}
.stat small{font-size:12px;color:var(--muted);font-weight:700}
.stat b{font-size:30px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}
.stat.r{align-items:flex-end}
.stat.r b{font-size:20px;color:var(--muted)}
#boardwrap{position:relative;width:var(--B,360px);height:var(--B,360px)}
#board{width:100%;height:100%;box-sizing:border-box;background:var(--board);border-radius:14px;padding:6px;
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:3px}
.cell{background:var(--cell);border-radius:20%;position:relative}
.cell.f{box-shadow:inset 0 -3px 0 #0003,inset 0 2px 0 #fff5}
.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}
.c5{background:var(--c5)}.c6{background:var(--c6)}.c7{background:var(--c7)}
.cell.gh{opacity:.55}
.cell.hl{outline:2.5px solid var(--text);outline-offset:-2.5px;opacity:1}
.cell.pop{animation:pop .3s ease-out forwards}
@keyframes pop{40%{transform:scale(1.15);filter:brightness(1.4)}100%{transform:scale(0);opacity:0}}
#tray{display:flex;justify-content:space-around;align-items:center;width:var(--B,360px);height:var(--TH,100px)}
.slot{flex:1;height:100%;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.pg{display:grid;gap:2px}
.pg>div{border-radius:20%;box-shadow:inset 0 -2px 0 #0003,inset 0 1px 0 #fff5}
.pg>div.e{visibility:hidden;box-shadow:none}
.slot.drag .pg{opacity:.2}
#float{position:fixed;left:0;top:0;pointer-events:none;z-index:10;display:grid;gap:3px}
#float>div{border-radius:20%;box-shadow:inset 0 -3px 0 #0003,inset 0 2px 0 #fff5}
#float>div.e{visibility:hidden;box-shadow:none}
#msg{position:absolute;left:0;right:0;top:38%;text-align:center;font-weight:900;font-size:34px;
  pointer-events:none;opacity:0;text-shadow:0 2px 0 var(--bg)}
#msg.show{animation:rise .9s ease-out}
@keyframes rise{0%{opacity:0;transform:translateY(12px) scale(.8)}20%{opacity:1;transform:scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
#over{position:absolute;inset:0;border-radius:14px;background:#0c0e22d9;color:#fff;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
#over.show{display:flex}
#over h2{margin:0;font-size:38px}
#over p{margin:0 0 10px;font-size:18px;opacity:.85}
#over button{font:inherit;font-weight:800;font-size:18px;padding:12px 28px;border:0;border-radius:14px;
  background:var(--c4);color:#0c2a1c;cursor:pointer}
@media (prefers-reduced-motion:reduce){.cell.pop,#msg.show{animation-duration:.01s}}
</style>
</head>
<body>
<div id="top">
  <div class="stat"><small>Score</small><b id="score">0</b></div>
  <div class="stat r"><small>Best</small><b id="best">0</b></div>
</div>
<div id="boardwrap">
  <div id="board"></div>
  <div id="msg"></div>
  <div id="over"><h2>Game over</h2><p id="fs"></p><button id="again">Play again</button></div>
</div>
<div id="tray"><div class="slot" data-i="0"></div><div class="slot" data-i="1"></div><div class="slot" data-i="2"></div></div>

<script>
(function(){
const N=8, root=document.documentElement;
const boardEl=document.getElementById('board'), trayEl=document.getElementById('tray');
const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
const msgEl=document.getElementById('msg'), overEl=document.getElementById('over');

/* ---------- shapes ---------- */
const BASE=["#","##","###","####","#####","##/##","###/###/###","#./##","#../#../###","###/.#.","##./.##",".##/##.","###/###"];
function norm(c){const mr=Math.min(...c.map(x=>x[0])),mc=Math.min(...c.map(x=>x[1]));
  return c.map(x=>[x[0]-mr,x[1]-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);}
const SHAPES=[], seen=new Set();
BASE.forEach(s=>{
  let c=[];s.split('/').forEach((row,r)=>[...row].forEach((ch,k)=>{if(ch==='#')c.push([r,k])}));
  for(let i=0;i<4;i++){c=norm(c.map(([r,k])=>[k,-r]));
    const key=JSON.stringify(c);if(!seen.has(key)){seen.add(key);SHAPES.push(c);}}
});
const dims=c=>[Math.max(...c.map(x=>x[0]))+1,Math.max(...c.map(x=>x[1]))+1];

/* ---------- state ---------- */
let grid,tray,score,best=0,streak,busy,over,drag=null;
try{best=+localStorage.getItem('bb-best')||0}catch(e){}

const cells=[];
for(let i=0;i<N*N;i++){const d=document.createElement('div');d.className='cell';boardEl.appendChild(d);cells.push(d);}

const rnd=a=>a[Math.floor(Math.random()*a.length)];
function fits(c,r,k){return c.every(([a,b])=>{const y=r+a,x=k+b;return y>=0&&y<N&&x>=0&&x<N&&!grid[y*N+x]})}
function placeable(c){for(let r=0;r<N;r++)for(let k=0;k<N;k++)if(fits(c,r,k))return true;return false}
function newTray(){
  let t;
  for(let n=0;n<30;n++){
    t=[0,1,2].map(()=>({c:rnd(SHAPES),col:1+Math.floor(Math.random()*7)}));
    if(t.some(p=>placeable(p.c)))break;
  }
  tray=t;
}
function fullLines(g){
  const s=new Set();
  for(let r=0;r<N;r++){let ok=true;for(let k=0;k<N;k++)if(!g[r*N+k]){ok=false;break}
    if(ok)for(let k=0;k<N;k++)s.add(r*N+k);}
  for(let k=0;k<N;k++){let ok=true;for(let r=0;r<N;r++)if(!g[r*N+k]){ok=false;break}
    if(ok)for(let r=0;r<N;r++)s.add(r*N+k);}
  return s;
}
const lineCount=s=>{let rows=0,cols=0;
  for(let r=0;r<N;r++){let ok=true;for(let k=0;k<N;k++)if(!s.has(r*N+k)){ok=false;break}if(ok)rows++}
  for(let k=0;k<N;k++){let ok=true;for(let r=0;r<N;r++)if(!s.has(r*N+k)){ok=false;break}if(ok)cols++}
  return rows+cols};

/* ---------- layout ---------- */
function layout(){
  const W=innerWidth,H=innerHeight;
  const s0=Math.max(10,Math.min(30,(W-24)/15-3));
  const TH=Math.round(5*s0+18);
  const B=Math.floor(Math.max(200,Math.min(W-12,H-46-TH-40,820)));
  root.style.setProperty('--B',B+'px');root.style.setProperty('--TH',TH+'px');
  const cs=((B-12-21)/8);
  const s=Math.min(s0,cs*0.58);
  trayEl.dataset.s=s;
  renderTray();
}

/* ---------- render ---------- */
function render(){
  for(let i=0;i<N*N;i++)cells[i].className='cell'+(grid[i]?' f c'+grid[i]:'');
  scoreEl.textContent=score;bestEl.textContent=best;
}
function pieceGrid(p,size,gap,cls){
  const [h,w]=dims(p.c);const g=document.createElement('div');
  g.className=cls;g.style.gridTemplateColumns=`repeat(${w},${size}px)`;g.style.gridAutoRows=size+'px';
  g.style.gap=gap+'px';
  const set=new Set(p.c.map(x=>x[0]*w+x[1]));
  for(let i=0;i<h*w;i++){const d=document.createElement('div');
    d.className=set.has(i)?'c'+p.col:'e';g.appendChild(d);}
  return g;
}
function renderTray(){
  const s=+trayEl.dataset.s||20;
  [...trayEl.children].forEach((slot,i)=>{
    slot.innerHTML='';slot.classList.toggle('drag',!!(drag&&drag.i===i));
    if(tray&&tray[i])slot.appendChild(pieceGrid(tray[i],s,2,'pg'));
  });
}

/* ---------- drag ---------- */
function geom(){
  const a=cells[0].getBoundingClientRect(),b=cells[1].getBoundingClientRect();
  return {ox:a.left,oy:a.top,pitch:b.left-a.left,cell:a.width};
}
trayEl.addEventListener('pointerdown',e=>{
  const slot=e.target.closest('.slot');if(!slot||busy||over)return;
  const i=+slot.dataset.i;if(!tray[i])return;
  e.preventDefault();
  const g=geom(),p=tray[i];
  const el=pieceGrid(p,g.cell,g.pitch-g.cell,'');el.id='float';
  document.body.appendChild(el);
  const [h,w]=dims(p.c);
  drag={i,el,g,w:w*g.pitch-(g.pitch-g.cell),h:h*g.pitch-(g.pitch-g.cell),
        lift:e.pointerType==='mouse'?34:g.pitch*1.8,anchor:null};
  slot.classList.add('drag');
  move(e);
});
function move(e){
  if(!drag)return;
  const d=drag,left=e.clientX-d.w/2,top=e.clientY-d.h-d.lift;
  d.el.style.transform=`translate(${left}px,${top}px)`;
  const c=Math.round((left-d.g.ox)/d.g.pitch),r=Math.round((top-d.g.oy)/d.g.pitch);
  const p=tray[d.i];render();d.anchor=null;
  if(fits(p.c,r,c)){
    d.anchor=[r,c];
    const t=grid.slice();p.c.forEach(([a,b])=>t[(r+a)*N+c+b]=p.col);
    const full=fullLines(t);
    p.c.forEach(([a,b])=>cells[(r+a)*N+c+b].className='cell gh c'+p.col);
    full.forEach(i=>cells[i].classList.add('hl'));
  }
}
addEventListener('pointermove',move);
function end(e){
  if(!drag)return;
  const d=drag;drag=null;d.el.remove();
  if(d.anchor)place(d.i,d.anchor[0],d.anchor[1]);else{render();renderTray();}
}
addEventListener('pointerup',end);addEventListener('pointercancel',end);

/* ---------- game flow ---------- */
function toast(t){msgEl.textContent=t;msgEl.classList.remove('show');void msgEl.offsetWidth;msgEl.classList.add('show');}
function place(i,r,c){
  const p=tray[i];
  p.c.forEach(([a,b])=>grid[(r+a)*N+c+b]=p.col);
  score+=p.c.length;tray[i]=null;
  const full=fullLines(grid),n=lineCount(full);
  render();renderTray();
  if(n){
    streak++;busy=true;
    const pts=10*n*n+10*(streak-1);score+=pts;
    toast((n>1?['','','Double','Triple','Quad','Mega'][Math.min(n,5)]+'! ':'')+'+'+pts+(streak>1?'  x'+streak:''));
    full.forEach(i=>cells[i].classList.add('pop'));
    setTimeout(()=>{full.forEach(i=>grid[i]=0);busy=false;after();},300);
  }else{streak=0;after();}
}
function after(){
  if(tray.every(p=>!p))newTray();
  if(score>best){best=score;try{localStorage.setItem('bb-best',best)}catch(e){}}
  render();renderTray();
  if(!tray.some(p=>p&&placeable(p.c))){
    over=true;document.getElementById('fs').textContent='Score '+score+(score>=best&&score>0?'  \u2022  New best!':'');
    overEl.classList.add('show');
  }
}
function start(){
  grid=new Array(N*N).fill(0);score=0;streak=0;busy=false;over=false;
  overEl.classList.remove('show');newTray();render();renderTray();
}
document.getElementById('again').addEventListener('click',start);
addEventListener('resize',layout);
start();layout();
})();
</script>
</body>
</html>
